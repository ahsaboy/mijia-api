name: Build ARM64 Static Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arm64-static:
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build fully static binary in Alpine
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            alpine:latest \
            sh -c '
              set -e

              echo "=== Installing build dependencies ==="
              apk add --no-cache \
                python3 python3-dev py3-pip \
                gcc g++ musl-dev make \
                patchelf ccache \
                zlib-dev zlib-static \
                libjpeg-turbo-dev libjpeg-turbo-static \
                libffi-dev \
                openssl-dev openssl-libs-static \
                libwebp-dev libwebp-static \
                freetype-dev freetype-static \
                lcms2-dev lcms2-static \
                openjpeg-dev \
                tiff-dev \
                zstd-dev zstd-static

              echo "=== Installing Python packages ==="
              pip3 install --break-system-packages \
                nuitka ordered-set zstandard \
                pillow pycryptodome qrcode requests tzlocal

              echo "=== Creating entry point ==="
              cat > main.py << EOF
#!/usr/bin/env python3
from mijiaAPI.__main__ import cli
if __name__ == "__main__":
    cli()
EOF

              echo "=== Building with Nuitka (fully static) ==="
              LDFLAGS="-static -static-libgcc -static-libstdc++" \
              CFLAGS="-static" \
              python3 -m nuitka \
                --onefile \
                --static-libpython=yes \
                --lto=yes \
                --include-package=mijiaAPI \
                --include-package=PIL \
                --include-package=Crypto \
                --include-package=qrcode \
                --include-package=requests \
                --include-package=tzlocal \
                --include-package=urllib3 \
                --include-package=charset_normalizer \
                --include-package=certifi \
                --include-package=idna \
                --remove-output \
                --assume-yes-for-downloads \
                --output-filename=mijiaAPI-arm64-static \
                --output-dir=dist \
                main.py

              echo "=== Checking output ==="
              ls -lh dist/
              file dist/mijiaAPI-arm64-static

              echo "=== Checking dynamic dependencies ==="
              ldd dist/mijiaAPI-arm64-static 2>&1 || echo "Good: statically linked"
            '

      - name: Verify static linking
        run: |
          chmod +x dist/mijiaAPI-arm64-static
          file dist/mijiaAPI-arm64-static
          # Check if truly static
          if ldd dist/mijiaAPI-arm64-static 2>&1 | grep -q "not a dynamic"; then
            echo "✓ Binary is statically linked"
          elif ldd dist/mijiaAPI-arm64-static 2>&1 | grep -q "statically linked"; then
            echo "✓ Binary is statically linked"
          else
            echo "⚠ Binary has dynamic dependencies:"
            ldd dist/mijiaAPI-arm64-static || true
          fi

      - name: Test binary
        run: |
          dist/mijiaAPI-arm64-static --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mijiaAPI-arm64-static
          path: dist/mijiaAPI-arm64-static
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/mijiaAPI-arm64-static
          body: |
            ## ARM64 Static Executable

            下载 `mijiaAPI-arm64-static` 后:
            ```bash
            chmod +x mijiaAPI-arm64-static
            ./mijiaAPI-arm64-static --help
            ```

            完全静态链接版本，适用于:
            - Linux ARM64 (树莓派、ARM 服务器等)
            - Android ARM64 (通过 adb shell 或 Termux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
