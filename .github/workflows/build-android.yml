name: Build ARM64 Static Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arm64-static:
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build binary with PyInstaller in Alpine
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            alpine:latest \
            sh -c '
              set -e

              echo "=== Installing build dependencies ==="
              apk add --no-cache \
                python3 python3-dev py3-pip \
                gcc g++ musl-dev make \
                zlib-dev zlib-static \
                libjpeg-turbo-dev \
                libffi-dev \
                openssl-dev openssl-libs-static \
                binutils \
                file \
                patchelf

              echo "=== Rebuilding PyInstaller bootloader with musl ==="
              pip3 install --break-system-packages --no-binary :all: pyinstaller

              echo "=== Installing project dependencies ==="
              pip3 install --break-system-packages \
                pillow pycryptodome qrcode requests tzlocal

              echo "=== Creating entry point ==="
              printf "%s\n" "#!/usr/bin/env python3" "from mijiaAPI.__main__ import cli" "if __name__ == \"__main__\":" "    cli()" > main.py

              echo "=== Building with PyInstaller ==="
              pyinstaller \
                --onefile \
                --strip \
                --name mijiaAPI-arm64-musl \
                --distpath dist \
                --hidden-import=PIL \
                --hidden-import=Crypto \
                --hidden-import=qrcode \
                --hidden-import=requests \
                --hidden-import=tzlocal \
                --hidden-import=urllib3 \
                --hidden-import=charset_normalizer \
                --hidden-import=certifi \
                --hidden-import=idna \
                --collect-submodules=mijiaAPI \
                --collect-submodules=PIL \
                --collect-submodules=Crypto \
                main.py

              echo "=== Checking output ==="
              ls -lh dist/
              file dist/mijiaAPI-arm64-musl

              echo "=== Installing StaticX ==="
              pip3 install --break-system-packages scons pyelftools
              pip3 install --break-system-packages --no-build-isolation staticx

              echo "=== Making portable binary with StaticX ==="
              staticx dist/mijiaAPI-arm64-musl dist/mijiaAPI-arm64-portable
              chmod +x dist/mijiaAPI-arm64-portable

              echo "=== Verifying portable binary ==="
              file dist/mijiaAPI-arm64-portable
              ls -lh dist/

              echo "=== Setting permissions ==="
              chown -R 1001:1001 dist/
            '

      - name: Verify binary
        run: |
          file dist/mijiaAPI-arm64-portable
          ldd dist/mijiaAPI-arm64-portable 2>&1 || echo "Statically linked"

      - name: Test binary
        run: |
          dist/mijiaAPI-arm64-portable --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mijiaAPI-arm64-portable
          path: dist/mijiaAPI-arm64-portable
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/mijiaAPI-arm64-portable
          body: |
            ## ARM64 Portable Executable

            下载 `mijiaAPI-arm64-portable` 后:
            ```bash
            chmod +x mijiaAPI-arm64-portable
            ./mijiaAPI-arm64-portable --help
            ```

            完全静态链接，适用于:
            - Linux ARM64 (树莓派、ARM 服务器等)
            - Android ARM64 (adb shell)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
