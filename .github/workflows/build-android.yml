name: Build ARM64 Static Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arm64-static:
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static binary with PyInstaller in Alpine
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            alpine:latest \
            sh -c '
              set -e

              echo "=== Installing build dependencies ==="
              apk add --no-cache \
                python3 python3-dev py3-pip \
                gcc g++ musl-dev make \
                zlib-dev zlib-static \
                libjpeg-turbo-dev \
                libffi-dev \
                openssl-dev openssl-libs-static \
                binutils \
                upx

              echo "=== Rebuilding PyInstaller bootloader with musl ==="
              pip3 install --break-system-packages --no-binary :all: pyinstaller

              echo "=== Installing project dependencies ==="
              pip3 install --break-system-packages \
                pillow pycryptodome qrcode requests tzlocal

              echo "=== Creating entry point ==="
              cat > main.py << EOF
#!/usr/bin/env python3
from mijiaAPI.__main__ import cli
if __name__ == "__main__":
    cli()
EOF

              echo "=== Building with PyInstaller ==="
              pyinstaller \
                --onefile \
                --strip \
                --name mijiaAPI-arm64-static \
                --distpath dist \
                --hidden-import=PIL \
                --hidden-import=Crypto \
                --hidden-import=qrcode \
                --hidden-import=requests \
                --hidden-import=tzlocal \
                --hidden-import=urllib3 \
                --hidden-import=charset_normalizer \
                --hidden-import=certifi \
                --hidden-import=idna \
                --collect-submodules=mijiaAPI \
                --collect-submodules=PIL \
                --collect-submodules=Crypto \
                main.py

              echo "=== Compressing with UPX ==="
              upx --best --lzma dist/mijiaAPI-arm64-static || echo "UPX compression skipped"

              echo "=== Checking output ==="
              ls -lh dist/
              file dist/mijiaAPI-arm64-static

              echo "=== Checking dynamic dependencies ==="
              ldd dist/mijiaAPI-arm64-static 2>&1 || echo "Static or minimal dependencies"
            '

      - name: Verify binary
        run: |
          chmod +x dist/mijiaAPI-arm64-static
          file dist/mijiaAPI-arm64-static
          ldd dist/mijiaAPI-arm64-static 2>&1 || true

      - name: Test binary
        run: |
          dist/mijiaAPI-arm64-static --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mijiaAPI-arm64-static
          path: dist/mijiaAPI-arm64-static
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/mijiaAPI-arm64-static
          body: |
            ## ARM64 Static Executable

            下载 `mijiaAPI-arm64-static` 后:
            ```bash
            chmod +x mijiaAPI-arm64-static
            ./mijiaAPI-arm64-static --help
            ```

            使用 musl libc 构建，适用于:
            - Linux ARM64 (树莓派、ARM 服务器等)
            - Android ARM64 (adb shell / Termux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
